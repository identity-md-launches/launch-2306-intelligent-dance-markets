[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# The independent verifier carries solc 0.8.20 to 0.8.30 offline; 0.8.26 is pinned by version only.
solc = "0.8.26"
# Robinhood Chain (chain id 4663) runs Arbitrum Nitro at ArbOS 61, which executes Cancun opcodes.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# The launch compares the deployed bytes without a metadata hash; a build with the default hash is
# refused as not reproducible.
bytecode_hash = "none"

# Nothing here needs the file system, the shell, or the network.
ffi = false
fs_permissions = []

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 512

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
